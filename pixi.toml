[workspace]
license = "Apache-2.0"
name = "op-builder-smoke"
version = "0.2.0"
description = "Model-free verification of shared Op execution and mapped Cog handoffs using a Cog the builder itself produced. This is not the cog-builder workflow. The second tally receives the first tally's counts as its prior counts, so the handoff is a real data dependency between two invocations of one code Cog."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
# 3.11+: the Op machinery matches the created-Cog floor
python = ">=3.11"
# op.yaml is YAML; declared input schemas are JSON Schema
pyyaml = "*"
jsonschema = "*"

[tasks]
op = "python src/op_runner.py"
test = "python -m unittest discover -s tests -v"

# ---------------------------------------------------------------------------
# An Op is not a Cog: this package carries no Cog profile manifest. Its
# executable spec is op.yaml (openteams/op-builder-smoke), and every worker it uses is an
# independently installable Cog invoked through that Cog's declared usage
# task. If this Op needs code, the answer is another Cog step — never a
# script in the Op.
# ---------------------------------------------------------------------------

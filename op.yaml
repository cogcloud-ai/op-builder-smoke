schema: openteams/op-manifest [0.1]
id: openteams/op-builder-smoke
version: 0.2.0
name: Builder execution smoke check
description: Model-free verification of shared Op execution and mapped Cog handoffs
  using a Cog the builder itself produced. This is not the cog-builder workflow. The
  second tally receives the first tally's counts as its prior counts, so the handoff
  is a real data dependency between two invocations of one code Cog.
inputs:
- name: first_texts
  description: Texts for the first tally.
  required: true
  schema:
    type: array
    minItems: 1
    items:
      type: string
  default:
  - "The Op layer sequences Cogs; the Gate decides, never the Cog."
  - "Don't re-run passed work: a resume finishes a run."
- name: second_texts
  description: Texts for the second tally, accumulated onto the first tally's counts.
  required: true
  schema:
    type: array
    minItems: 1
    items:
      type: string
  default:
  - "The Cog reports; the Gate decides. 42 steps, 1 Track."
steps:
- id: tally
  name: Tally the first texts
  cog:
    id: openteams/cog-word-tally
    version: 0.1.0
    source: ../cog-word-tally
    task: run
  input:
    texts:
      $from: inputs.first_texts
  expected_outcome: Word counts and a total with a passing envelope Gate.
  gate:
    policy: envelope-ok-no-error-problems
    guards: []
  on_fail: stop
- id: handoff
  name: Accumulate the second texts onto the first tally
  depends_on:
  - tally
  cog:
    id: openteams/cog-word-tally
    version: 0.1.0
    source: ../cog-word-tally
    task: run
  input:
    texts:
      $from: inputs.second_texts
    prior_counts:
      $from: steps.tally.payload.counts
  expected_outcome: The first tally's counts preserved and increased by the second
    texts; total_words is the sum of both.
  gate:
    policy: envelope-ok-no-error-problems
    guards: []
  on_fail: stop
outputs:
  first_tally:
    $from: steps.tally.payload
  accumulated_tally:
    $from: steps.handoff.payload
track:
  records:
  - input_request
  - step_requests
  - cog_envelopes
  - contract_check_problems
  - gate_decisions
  - model_bindings
  - output_artifacts
